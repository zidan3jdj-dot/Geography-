<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجغرافي</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;800&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<!-- Style -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- NAVBAR -->
<nav>
  <h1>🌍 الجغرافي</h1>
  <div>
    <button onclick="go('quiz')">🧠 الأسئلة</button>
    <button onclick="go('mapSection')">🗺️ الخريطة</button>
  </div>
</nav>

<!-- HERO -->
<header class="hero">
  <h2>استكشف العالم بطريقة احترافية</h2>
  <p>تعلم الجغرافيا من خلال التفاعل والتحدي</p>
  <button onclick="go('quiz')">ابدأ الآن</button>
</header>

<!-- QUIZ -->
<section id="quiz" class="fade">
  <h2>🧠 تحدي الجغرافيا</h2>

  <div class="card">
    <h3 id="question">جارٍ التحميل...</h3>
    <div class="answers" id="answers"></div>
    <h3 id="result"></h3>
  </div>

</section>

<!-- MAP -->
<section id="mapSection" class="fade">
  <h2>🗺️ خريطة تفاعلية</h2>

  <div class="card">
    <div id="map"></div>
  </div>

</section>

<!-- FOOTER -->
<footer style="text-align:center;padding:30px;opacity:0.6">
  © 2026 - الجغرافي | منصة تعليمية تفاعلية
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
