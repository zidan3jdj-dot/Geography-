<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>المركز الجغرافي العربي | الموسوعة الجغرافية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- خلفية متحركة 3D -->
    <div class="bg-particles"></div>
    
    <div class="stars"></div>
    <div class="twinkling"></div>

    <div class="app-wrapper">
        <!-- الهيدر -->
        <header class="hero-header">
            <div class="hero-content">
                <div class="hero-icon">
                    <i class="fas fa-globe-americas"></i>
                </div>
                <h1>المركز الجغرافي العربي</h1>
                <p>اكتشف العالم بعيون عربية | الموسوعة الجغرافية الرسمية</p>
            </div>
        </header>

        <!-- التنقل -->
        <nav class="navigation">
            <button class="nav-link active" data-page="home">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </button>
            <button class="nav-link" data-page="maps">
                <i class="fas fa-map-marked-alt"></i>
                <span>الخرائط</span>
            </button>
            <button class="nav-link" data-page="quiz">
                <i class="fas fa-brain"></i>
                <span>التحدي</span>
            </button>
            <button class="nav-link" data-page="compare">
                <i class="fas fa-chart-line"></i>
                <span>المقارنة</span>
            </button>
            <button class="nav-link" data-page="stats">
                <i class="fas fa-trophy"></i>
                <span>الإحصائيات</span>
            </button>
        </nav>

        <!-- المحتوى -->
        <main class="page-container">
            <!-- الصفحة الرئيسية -->
            <div id="home" class="page active">
                <div class="facts-grid" id="factsGrid"></div>
                
                <div class="dashboard">
                    <div class="dashboard-card glass">
                        <div class="card-icon gradient-bg">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                        <h3>رحلة المستكشف</h3>
                        <div class="stats-dashboard">
                            <div class="stat-circle">
                                <span class="stat-number" id="homeScore">0</span>
                                <span class="stat-title">نقاط</span>
                            </div>
                            <div class="stat-circle">
                                <span class="stat-number" id="homeCorrect">0</span>
                                <span class="stat-title">صحيح</span>
                            </div>
                            <div class="stat-circle">
                                <span class="stat-number" id="homeAccuracy">0%</span>
                                <span class="stat-title">دقة</span>
                            </div>
                            <div class="stat-circle">
                                <span class="stat-number" id="homeLevel">1</span>
                                <span class="stat-title">مستوى</span>
                            </div>
                        </div>
                        <button class="btn-glow" onclick="window.navigateTo('quiz')">
                            <i class="fas fa-play"></i> ابدأ التحدي
                        </button>
                    </div>
                    
                    <div class="dashboard-card glass">
                        <div class="card-icon gradient-bg">
                            <i class="fas fa-globe-asia"></i>
                        </div>
                        <h3>معلومات سريعة</h3>
                        <div class="quick-info" id="quickInfo"></div>
                    </div>
                </div>
            </div>

            <!-- صفحة الخرائط -->
            <div id="maps" class="page">
                <div class="glass">
                    <div class="section-title">
                        <i class="fas fa-map"></i>
                        <h2>الخريطة التفاعلية</h2>
                    </div>
                    <div class="search-area">
                        <input type="text" id="searchInput" placeholder="🔍 ابحث عن مدينة، دولة، أو معلم...">
                        <button class="btn-search" onclick="window.searchLocation()"><i class="fas fa-search"></i></button>
                    </div>
                    <div id="map"></div>
                    <div class="map-buttons">
                        <button class="btn-outline" onclick="window.changeLayer('street')"><i class="fas fa-map"></i> خريطة</button>
                        <button class="btn-outline" onclick="window.changeLayer('satellite')"><i class="fas fa-satellite"></i> قمر صناعي</button>
                    </div>
                    <div id="mapInfo" class="map-info"></div>
                </div>
            </div>

            <!-- صفحة التحدي -->
            <div id="quiz" class="page">
                <div class="glass">
                    <div class="section-title">
                        <i class="fas fa-question-circle"></i>
                        <h2>التحدي الجغرافي</h2>
                    </div>
                    <div class="quiz-bar">
                        <div class="timer-circle">
                            <i class="fas fa-hourglass-half"></i>
                            <span id="timer">00:15</span>
                        </div>
                        <button class="btn-category" onclick="window.changeCategory()">
                            <i class="fas fa-layer-group"></i> <span id="currentCategory">الكل</span>
                        </button>
                    </div>
                    <div id="question" class="question-card"></div>
                    <div id="answers" class="answers-container"></div>
                    <div id="quizFeedback" class="quiz-feedback"></div>
                    <button id="nextBtn" class="btn-next" onclick="window.nextQuestion()">السؤال التالي <i class="fas fa-arrow-left"></i></button>
                </div>
            </div>

            <!-- صفحة المقارنة -->
            <div id="compare" class="page">
                <div class="glass">
                    <div class="section-title">
                        <i class="fas fa-chart-simple"></i>
                        <h2>مقارنة الدول</h2>
                    </div>
                    <div class="compare-boxes">
                        <select id="country1" class="country-picker" onchange="window.compareCountries()"></select>
                        <select id="country2" class="country-picker" onchange="window.compareCountries()"></select>
                    </div>
                    <div id="compareResult" class="compare-cards"></div>
                    <div class="chart-area">
                        <canvas id="compareChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- صفحة الإحصائيات -->
            <div id="stats" class="page">
                <div class="glass">
                    <div class="section-title">
                        <i class="fas fa-chart-line"></i>
                        <h2>إنجازاتك الجغرافية</h2>
                    </div>
                    <div class="achievements">
                        <div class="achievement-card">
                            <div class="achievement-icon">🏆</div>
                            <div class="achievement-value" id="statScore">0</div>
                            <div class="achievement-label">إجمالي النقاط</div>
                        </div>
                        <div class="achievement-card">
                            <div class="achievement-icon">✅</div>
                            <div class="achievement-value" id="statCorrect">0</div>
                            <div class="achievement-label">إجابات صحيحة</div>
                        </div>
                        <div class="achievement-card">
                            <div class="achievement-icon">🔥</div>
                            <div class="achievement-value" id="statStreak">0</div>
                            <div class="achievement-label">أطول سلسلة</div>
                        </div>
                        <div class="achievement-card">
                            <div class="achievement-icon">📊</div>
                            <div class="achievement-value" id="statAccuracy">0%</div>
                            <div class="achievement-label">نسبة الدقة</div>
                        </div>
                        <div class="achievement-card">
                            <div class="achievement-icon">⭐</div>
                            <div class="achievement-value" id="statRank">مبتدئ</div>
                            <div class="achievement-label">الرتبة</div>
                        </div>
                    </div>
                    <button class="btn-reset" onclick="window.resetProgress()">
                        <i class="fas fa-trash-alt"></i> إعادة تعيين التقدم
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
